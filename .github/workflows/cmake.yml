name: CMake build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'

permissions: read-all

jobs:
  build:
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            macos-latest,
            windows-latest,
          ]

    runs-on: ${{ matrix.os }}

    env:
      BUILD: _build

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare build directory
        run: mkdir ${{ env.BUILD }}

      - name: Configure
        run: cmake -S . -B ${{ env.BUILD }}

      - name: Build
        run: cmake --build ${{ env.BUILD }}

      - name: Test
        run: ctest --test-dir ${{ env.BUILD }} -V -C Debug
